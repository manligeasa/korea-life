<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Hanji paper texture filter -->
    <filter id="hanjiGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.93   0 0 0 0 0.89  0 0 0 0.28 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Base Hanji warm mulberry paper tone -->
  <rect width="400" height="400" fill="#FAF7F2" />
  <rect width="400" height="400" filter="url(#hanjiGrain)" fill="#FAF7F2" opacity="0.65" />

  <!-- Organic handmade mulberry fiber streaks (닥나무 섬유결) -->
  <g stroke="#E0D6C3" stroke-linecap="round" fill="none" opacity="0.45">
    <!-- Fibers -->
    <path d="M 20,40 Q 60,35 110,48 T 190,42" stroke-width="0.8" stroke-dasharray="8,14,3,9" />
    <path d="M 280,30 Q 320,50 370,45" stroke-width="0.6" stroke-dasharray="6,12" />
    <path d="M 80,140 Q 140,165 210,145 T 310,160" stroke-width="0.9" stroke-dasharray="10,18,4,12" />
    <path d="M 10,220 Q 50,210 90,230" stroke-width="0.5" stroke-dasharray="5,10" />
    <path d="M 240,210 Q 290,230 350,215 T 395,228" stroke-width="0.75" stroke-dasharray="12,15,3,8" />
    <path d="M 60,320 Q 130,305 180,335 T 270,320" stroke-width="0.8" stroke-dasharray="7,14,5,10" />
    <path d="M 310,340 Q 350,360 390,345" stroke-width="0.6" stroke-dasharray="8,12" />
    <path d="M 130,380 Q 170,395 220,385" stroke-width="0.7" stroke-dasharray="4,11" />
  </g>
</svg>
